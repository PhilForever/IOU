name: Feature request
description: Suggest a focused improvement to IOU.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the bookkeeping task or inconvenience, using invented names if needed.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Explain what the addon should do and how it would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Optional workarounds or related examples.
