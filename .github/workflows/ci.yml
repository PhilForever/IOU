name: Validate addon

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Lua 5.1 regression tests
        run: python tools/test_iou.py
      - name: Check release integrity and publishing behavior
        run: python tools/test_curseforge.py
      - name: Build installable ZIP
        run: python tools/package_iou.py
      - name: Upload test build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: IOU-test-build
          path: |
            artifacts/IOU-*.zip
            artifacts/IOU-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
